<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PEAKLINE — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #080810;
      --surface: #0e0e1a;
      --border:  rgba(255,255,255,.07);
      --cyan:    #00E5FF;
      --purple:  #9B4DFF;
      --gray1:   rgba(255,255,255,.85);
      --gray2:   rgba(255,255,255,.45);
      --gray3:   rgba(255,255,255,.15);
      --font-head:'Barlow Condensed', sans-serif;
      --font-body:'Barlow', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--gray1);
      font-family: var(--font-body); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* background glow */
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 50%, rgba(0,229,255,.05) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 50%, rgba(155,77,255,.05) 0%, transparent 70%);
    }
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* card */
    .card {
      position: relative; z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%; max-width: 420px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);
    }

    /* logo */
    .logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      font-family: var(--font-head); font-size: 20px; font-weight: 900;
      letter-spacing: 3px; color: #fff;
      justify-content: center; margin-bottom: 36px;
    }

    /* heading */
    .heading { font-family: var(--font-head); font-size: 34px; font-weight: 900; letter-spacing: 1px; text-align: center; margin-bottom: 6px; }
    .subheading { font-size: 14px; color: var(--gray2); text-align: center; margin-bottom: 32px; }

    /* suggested account pill */
    .suggested {
      display: flex; align-items: center; gap: 12px;
      background: rgba(0,229,255,.06);
      border: 1px solid rgba(0,229,255,.18);
      border-radius: 14px; padding: 12px 14px;
      margin-bottom: 24px; cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .suggested:hover { background: rgba(0,229,255,.1); border-color: rgba(0,229,255,.35); }
    .suggested-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-size: 16px; font-weight: 900; color: #000;
      flex-shrink: 0;
    }
    .suggested-info { flex: 1; }
    .suggested-name { font-size: 14px; font-weight: 600; color: var(--gray1); }
    .suggested-email { font-size: 12px; color: var(--gray2); margin-top: 1px; }
    .suggested-arrow { color: var(--cyan); font-size: 18px; }

    /* or divider */
    .or-divider { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .or-line { flex: 1; height: 1px; background: var(--border); }
    .or-text { font-size: 12px; color: var(--gray3); letter-spacing: 1px; }

    /* form */
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gray2); margin-bottom: 8px; }
    .field input {
      width: 100%; padding: 14px 16px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--gray1); font-family: var(--font-body); font-size: 15px;
      outline: none; transition: border-color .2s, background .2s;
    }
    .field input:focus { border-color: var(--cyan); background: rgba(0,229,255,.04); }
    .field input::placeholder { color: var(--gray3); }

    /* forgot */
    .forgot { text-align: right; margin-top: -8px; margin-bottom: 24px; }
    .forgot a { font-size: 12px; color: var(--gray2); text-decoration: none; }
    .forgot a:hover { color: var(--cyan); }

    /* submit */
    .btn-login {
      width: 100%; padding: 16px;
      border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      font-family: var(--font-head); font-size: 16px; font-weight: 800;
      letter-spacing: 3px; text-transform: uppercase; color: #fff;
      cursor: pointer; transition: opacity .2s, transform .15s;
      margin-bottom: 16px;
    }
    .btn-login:hover { opacity: .9; transform: translateY(-2px); }
    .btn-login:active { transform: translateY(0); }

    /* social */
    .btn-social {
      width: 100%; padding: 13px;
      border: 1px solid var(--border); border-radius: 12px;
      background: transparent;
      font-family: var(--font-body); font-size: 14px; font-weight: 500;
      color: var(--gray2); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: border-color .2s, color .2s; margin-bottom: 10px;
    }
    .btn-social:hover { border-color: var(--gray3); color: var(--gray1); }

    /* register */
    .register { text-align: center; font-size: 13px; color: var(--gray2); margin-top: 24px; }
    .register a { color: var(--cyan); text-decoration: none; font-weight: 600; }
    .register a:hover { text-decoration: underline; }

    /* success overlay */
    .success-overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(8,8,16,.92); backdrop-filter: blur(12px);
      align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    }
    .success-overlay.show { display: flex; }
    .success-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(0,229,255,.12);
      border: 2px solid var(--cyan);
      display: flex; align-items: center; justify-content: center;
      animation: pop .4s ease;
    }
    @keyframes pop { 0%{transform:scale(.5);opacity:0} 80%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
    .success-title { font-family: var(--font-head); font-size: 32px; font-weight: 900; letter-spacing: 2px; color: #fff; }
    .success-sub { font-size: 14px; color: var(--gray2); }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <div class="card">

    <a href="index.html" class="logo">
      <svg width="30" height="30" viewBox="0 0 36 36" fill="none">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00E5FF"/><stop offset="100%" stop-color="#9B4DFF"/></linearGradient></defs>
        <polygon points="18,3 34,33 2,33" fill="none" stroke="url(#lg)" stroke-width="2.5"/>
        <polygon points="18,9 28,33 8,33" fill="rgba(155,77,255,.12)"/>
        <circle cx="18" cy="3" r="2.5" fill="#00E5FF"/>
      </svg>
      PEAKLINE
    </a>

    <div class="heading">Welcome back</div>
    <div class="subheading">Sign in to your account</div>

    <!-- Suggested account -->
    <div class="suggested" onclick="useSuggested()">
      <div class="suggested-avatar" id="suggestedInitial">C</div>
      <div class="suggested-info">
        <div class="suggested-name" id="suggestedName">Chantal G.</div>
        <div class="suggested-email" id="suggestedEmailLabel">chantal.gallesich@peakline.com</div>
      </div>
      <div class="suggested-arrow">→</div>
    </div>

    <div class="or-divider">
      <div class="or-line"></div>
      <div class="or-text">OR</div>
      <div class="or-line"></div>
    </div>

    <!-- Form -->
    <form onsubmit="handleLogin(event)">
      <div class="field">
        <label>Email</label>
        <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="forgot"><a href="#">Forgot password?</a></div>
      <button type="submit" class="btn-login">Sign In →</button>
    </form>

    <button class="btn-social">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="register">
      Don't have an account? <a href="#">Create one</a>
    </div>
  </div>

  <!-- Success overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00E5FF" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="success-title">Signed In</div>
    <div class="success-sub">Redirecting to your account…</div>
  </div>

  <script>
    const SUGGESTED = {
      name: 'Chantal G.',
      email: 'chantal.gallesich@peakline.com',
      initial: 'C'
    };

    document.getElementById('suggestedName').textContent = SUGGESTED.name;
    document.getElementById('suggestedEmailLabel').textContent = SUGGESTED.email;
    document.getElementById('suggestedInitial').textContent = SUGGESTED.initial;

    function useSuggested() {
      document.getElementById('emailInput').value = SUGGESTED.email;
      document.getElementById('passwordInput').focus();
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passwordInput').value;
      if (!email || !pass) return;
      document.getElementById('successOverlay').classList.add('show');
      setTimeout(() => { window.location.href = 'index.html'; }, 1800);
    }
  </script>
</body>
</html>
